<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NewAmp</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="viz-canvas"></canvas>

  <div id="drop-overlay" class="hidden">
    <div class="drop-message">Drop audio file here</div>
  </div>

  <div id="controls">
    <div class="controls-row">
      <label class="file-btn">
        <input type="file" id="file-input" accept="audio/*" />
        Open
      </label>
      <button id="play-btn" class="transport-btn" title="Play/Pause" disabled>&#9654;</button>
      <button id="stop-btn" class="transport-btn" title="Stop" disabled>&#9632;</button>
      <span id="time-current" class="time">0:00</span>
      <input type="range" id="seek-bar" min="0" max="1000" value="0" step="1" />
      <span id="time-total" class="time">0:00</span>
      <div class="volume-group">
        <span class="volume-icon">&#128264;</span>
        <input type="range" id="volume" min="0" max="100" value="80" />
      </div>
      <select id="preset-select"></select>
      <button id="editor-toggle" class="transport-btn" title="Shader Editor">{ }</button>
      <button id="fullscreen-btn" class="transport-btn" title="Fullscreen">&#x26F6;</button>
    </div>
    <div id="track-name" class="track-name">No file loaded</div>
  </div>

  <!-- Shader Editor Panel -->
  <div id="editor-panel" class="hidden">
    <div id="editor-toolbar">
      <button id="editor-close" class="editor-btn" title="Close">&times;</button>
      <input type="text" id="shader-name" value="Custom Shader" placeholder="Shader name" />
      <div class="toolbar-spacer"></div>
      <button id="new-preset" class="editor-btn" title="New shader">New</button>
      <button id="save-preset" class="editor-btn" title="Save to browser">Save</button>
      <button id="delete-preset" class="editor-btn danger" title="Delete preset">Delete</button>
      <span class="toolbar-sep"></span>
      <button id="export-preset" class="editor-btn" title="Export as JSON">Export</button>
      <label class="editor-btn" title="Import JSON preset">
        Import
        <input type="file" id="import-preset" accept=".json" hidden />
      </label>
    </div>
    <div id="monaco-container"></div>
    <div id="shader-errors"></div>
    <div id="uniform-inspector"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
